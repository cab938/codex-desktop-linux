<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Collaborative Markdown Editor</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0;
        color: GrayText;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Collaborative Markdown Editor</h1>
      <p>
        The document session is ready. The production CodeMirror application
        is installed by the next feature package.
      </p>
    </main>
  </body>
</html>
